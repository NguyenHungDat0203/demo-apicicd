name: Production Monitor

on:
  schedule:
    # Chạy tự động mỗi 6 giờ một lần (bạn có thể tùy chỉnh)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  monitor-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cài đặt Newman
        run: npm install -g newman

      - name: Chạy API Test Monitor
        run: |
          newman run RestfulBooker_API_Collection.json \
            -e RestfulBooker.postman_environment.json
